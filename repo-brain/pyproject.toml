[project]
name = "repo-brain"
version = "0.1.0"
description = "A coding crew that never cold-starts: LangGraph agents with persistent team memory in MongoDB Atlas"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-mongodb>=0.1",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.1",
    "langchain-core>=0.3",
    "pymongo>=4.9",
    "openai>=1.50",
    "rich>=13",
    "typer>=0.12",
    "fastmcp>=2",
    "python-dotenv>=1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pytest>=8",
]

[project.scripts]
crew = "repo_brain.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_brain"]

[tool.ruff]
line-length = 100
